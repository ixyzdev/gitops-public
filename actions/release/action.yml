name: Release
description: >
  Tag and publish the next version of a repository from what its commits say:
  patch by default, minor or major only when a commit asks for it with a
  "Release:" trailer.

inputs:
  version-files:
    description: >
      JSON files, separated by spaces, whose top-level "version" is set to the
      released version and committed before tagging.
    required: false
    default: ""
  token:
    description: Token that pushes the tag and creates the GitHub release.
    required: false
    default: ${{ github.token }}
  claude-code-oauth-token:
    description: >
      Claude subscription token from "claude setup-token". When set, Claude
      rewrites the generated notes of each release following release-notes.md.
    required: false
    default: ""

outputs:
  version:
    description: The released version without the "v" prefix; empty when nothing was released.
    value: ${{ steps.release.outputs.version }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ inputs.token }}

    - id: release
      shell: bash
      env:
        VERSION_FILES: ${{ inputs.version-files }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "${GITHUB_ACTION_PATH}/release.sh"

    - id: notes-prompt
      if: inputs.claude-code-oauth-token != '' && steps.release.outputs.version != ''
      shell: bash
      env:
        RELEASE_TAG: v${{ steps.release.outputs.version }}
        PREVIOUS_TAG: ${{ steps.release.outputs.previous-tag }}
      run: |
        {
          echo 'text<<RELEASE_NOTES_PROMPT'
          echo "Release tag: ${RELEASE_TAG}. Previous tag: ${PREVIOUS_TAG:-none}."
          echo
          cat "${GITHUB_ACTION_PATH}/release-notes.md"
          echo 'RELEASE_NOTES_PROMPT'
        } >>"$GITHUB_OUTPUT"

    - if: steps.notes-prompt.outcome == 'success'
      uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
      env:
        GH_TOKEN: ${{ inputs.token }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.token }}
        prompt: ${{ steps.notes-prompt.outputs.text }}
        claude_args: >-
          --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh api:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh release view:*),Bash(gh release edit:*)"
